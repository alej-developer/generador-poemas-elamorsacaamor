name: Verificar y publicar

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fijar la versión de npm
        run: npm install -g npm@11.6.2

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el estilo
        run: npm run lint

      - name: Construir el proyecto
        run: npm run build

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar las pruebas
        run: pip install -r tests_python/requirements.txt

      - name: Instalar el navegador de prueba
        run: playwright install --with-deps chromium

      - name: Probar contra la build local
        env:
          BASE_URL: http://127.0.0.1:4173/generador-poemas-elamorsacaamor/
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null "$BASE_URL"; then
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null "$BASE_URL"
          pytest tests_python -q

  desplegar:
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fijar la versión de npm
        run: npm install -g npm@11.6.2

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el proyecto
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
