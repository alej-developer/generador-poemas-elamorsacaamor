# Workflow para desplegar sitios estáticos de Vite a GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta cuando se hace push a la rama main
  push:
    branches: ['main']

  # Permite ejecutar este workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Da permisos a GITHUB_TOKEN para subir a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue a la vez, ignorando las ejecuciones en curso
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Construir el proyecto
        run: npm run build
        
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          # Ruta donde Vite hace el build (dist)
          path: './dist'
          
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
